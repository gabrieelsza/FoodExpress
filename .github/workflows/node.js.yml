name: CI/CD — Build, Test & Deploy (GitHub Pages)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # T01: Esteira de verificação automatizada de qualidade e build do Frontend
  quality_and_build:
    name: "T01 — Lint & Build (Frontend)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Instalar dependências
        run: npm ci

      - name: Executar Linter (ESLint)
        run: npm run lint

      - name: Gerar Build de Produção
        run: npm run build

      - name: Publicar na branch gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist

      - name: Publicar artefato para o GitHub Pages (Actions)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend/dist"

  deploy:
    name: "T02 — Deploy no GitHub Pages"
    if: github.event_name != 'pull_request'
    needs: quality_and_build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
