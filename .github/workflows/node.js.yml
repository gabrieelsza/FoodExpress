name: CI/CD — Build, Test & Deploy Admin (GitHub Pages)
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  # T01: Esteira de verificação automatizada de qualidade a cada entrega
  quality_and_build:
    name: "T01 — Lint & Build (Frontend)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"
      - name: Instalar dependências
        run: npm ci
      - name: Executar Linter (ESLint)
        run: npm run lint
      - name: Gerar Build de Produção
        run: npm run build
      - name: Configurar GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Publicar artefato para o GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend/dist"
